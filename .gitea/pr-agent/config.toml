# PR-Agent settings for Leuchtfeuer (.gitea/workflows/pr-agent.yml); the rest
# are PR-Agent's defaults.
[config]
git_provider = "gitea"
response_language = "de-DE"
max_model_tokens = 128000
fallback_models = []
publish_output_progress = false
# The repository rules go along as context.
repo_context_files = ["CLAUDE.md"]

[pr_reviewer]
num_max_findings = 5
require_can_be_split_review = true
enable_review_labels_effort = false
enable_review_labels_security = false
extra_instructions = """
You review pull requests of Leuchtfeuer, a device-independent platform that
turns small computers with a speaker into smart speakers (first target:
Harman Kardon Invoke): leuchtfeuerd with web UI, audio receivers
(UPnP/DLNA, Spotify Connect, Tidal Connect, Sendspin), Bluetooth; device
specifics live in targets/<device>/.
The PRs are written by an AI agent; review them as a careful second
reader, not as their author.

Report only findings that matter:
- Bugs: a concrete input or state and the wrong result or crash it gives.
  Name file and line.
- Security: the devices stay on the network. Anything reachable from
  the LAN without the checks it needs, shell injection, outdated TLS,
  HTTP or media-parser libraries.
- Device specifics in the common core; modules that are not optional
  or waste space on the device.
- NAND: writes to mtd partitions without a full raw backup first.
- Missing tests for new behaviour.
- Breaches of the repository rules (CLAUDE.md).

Skip style, naming and formatting (shellcheck and tests/run.sh run separately), praise, and
guesses you cannot back with the diff. When you find nothing that
matters, say so in one line.
"""

[pr_code_suggestions]
extra_instructions = """
Only suggestions that fix a bug or a missing check; no style.
"""
