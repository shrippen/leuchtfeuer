# Eigener Softvol-Regler "Leuchtfeuer Music" für alle Musikdienste. Das Drehrad setzt die Regler
# "system"/"voice", und der Harman-Dienst audio-ui dämpft "music" bei jedem Rastschritt auf 0
# (Musik setzt kurz aus). Der Regler hier kennt audio-ui nicht; leuchtfeuerd setzt ihn auf den Wert von "system".
# Kette: Abgriff + Klang (LADSPA) -> softvol -> volmix_music (dmix) -> DSP.
# Die Umwandlung auf 48 kHz Float geschieht hier vor dem LADSPA-Glied: dmix legt die Periodendauer auf 5333,33 µs
# fest, und bei freier Rate vor dem LADSPA-Glied ergibt das z. B. bei 44,1 kHz ein leeres Intervall
# (PortAudio/Tidal bricht dann mit "snd_interval_empty" ab).
pcm.leuchtfeuer_music {
    type plug
    slave {
        pcm "leuchtfeuer_viz_tap"
        rate 48000
        format FLOAT_LE
        channels 2
    }
}

# 1. Tonabgriff für den Leuchtring-Visualizer (leuchtfeuerd): reicht den Ton unverändert durch und legt eine
#    Mono-Kopie in /dev/shm/leuchtfeuer-viz, ohne je zu warten (device/src/leuchtfeuer-viz-tap.c). Sitzt vor Klang und
#    Lautstärkeregler, damit die Anzeige von beiden nicht abhängt.
# 2. Klang (device/src/leuchtfeuer-eq.c): Bass, Höhen, Loudness und Nachtmodus (Kompressor). Die Werte setzt leuchtfeuerd live
#    über /dev/shm/leuchtfeuer-eq; ohne diese Datei reicht das Plugin den Ton unverändert durch.
pcm.leuchtfeuer_viz_tap {
    type ladspa
    slave.pcm "plug:leuchtfeuer_music_vol"
    path "/data/leuchtfeuer/lib/ladspa"
    channels 2
    plugins [ {
        label leuchtfeuer_viz_tap
        policy none
        input.bindings.0 "In L"
        input.bindings.1 "In R"
        output.bindings.0 "Out L"
        output.bindings.1 "Out R"
    } {
        label leuchtfeuer_eq
        policy none
        input.bindings.0 "In L"
        input.bindings.1 "In R"
        output.bindings.0 "Out L"
        output.bindings.1 "Out R"
    } ]
}

pcm.leuchtfeuer_music_vol {
    type softvol
    slave.pcm "volmix_music"
    control.name "Leuchtfeuer Music"
    control.card 0
}

# Durchsagen (leuchtfeuerd: Home Assistant, Türklingel): an Quellen-Reglern, Klang und Visualizer vorbei, eigener Regler
# "Leuchtfeuer Announce" (folgt "system"). Während der Durchsage senkt leuchtfeuerd die Quellen ab.
pcm.leuchtfeuer_announce {
    type plug
    slave {
        pcm "leuchtfeuer_announce_vol"
        rate 48000
    }
}
pcm.leuchtfeuer_announce_vol {
    type softvol
    slave.pcm "volmix_music"
    control.name "Leuchtfeuer Announce"
    control.card 0
}
