# Für alle Musikdienste: per ALSA_CONFIG=/data/leuchtfeuer/asound-music.conf laden (siehe /etc/asound.conf).
</etc/asound-product.conf>

# Standardgerät (miniaudio/Sendspin, PortAudio/Tidal): das Quellen-PCM aus der Umgebungsvariablen LEUCHTFEUER_SRC
# (z. B. LEUCHTFEUER_SRC=sendspin -> leuchtfeuer_sendspin), ohne sie "leuchtfeuer_music".
# Der Hint ist nötig: miniaudio (Sendspin) listet nur PCMs mit Hint. Fehlt er, fehlt "default"
# in der Liste und miniaudio nimmt das erste Gerät, das Null-Gerät ("Discard all samples"):
# kein Ton und ein Kern dauerhaft ausgelastet.
pcm.!default {
    type plug
    slave.pcm {
        @func concat
        strings [ "leuchtfeuer_" { @func getenv vars [ LEUCHTFEUER_SRC ] default "music" } ]
    }
    hint {
        show on
        description "Default Audio Device"
    }
}

# Je Quelle ein PCM mit eigenem Softvol-Regler "Quelle <name>": leuchtfeuerd schaltet damit eine Quelle stumm
# (Quellen-Regel: die neueste Quelle hat Vorrang) oder senkt alle für eine Durchsage ab. Die Regler stehen
# normalerweise auf 255 (0 dB) und ändern die Lautstärke des Geräts nicht.
pcm.leuchtfeuer_spotify {
    type plug
    slave.pcm "leuchtfeuer_spotify_vol"
    hint { show on description "Leuchtfeuer spotify" }
}
pcm.leuchtfeuer_spotify_vol {
    type softvol
    slave.pcm "leuchtfeuer_music"
    control { name "Quelle spotify" card 0 }
}
