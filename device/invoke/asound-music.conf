# Eigener Softvol-Regler "Invoke Music" für alle Musikdienste. Das Drehrad setzt die Regler
# "system"/"voice", und der Harman-Dienst audio-ui dämpft "music" bei jedem Rastschritt auf 0
# (Musik setzt kurz aus). Der Regler hier kennt audio-ui nicht; invoked setzt ihn auf den Wert von "system".
# Kette: Abgriff + Klang (LADSPA) -> softvol -> volmix_music (dmix) -> DSP.
# Die Umwandlung auf 48 kHz Float geschieht hier vor dem LADSPA-Glied: dmix legt die Periodendauer auf 5333,33 µs
# fest, und bei freier Rate vor dem LADSPA-Glied ergibt das z. B. bei 44,1 kHz ein leeres Intervall
# (PortAudio/Tidal bricht dann mit "snd_interval_empty" ab).
pcm.invoke_music {
    type plug
    slave {
        pcm "invoke_viz_tap"
        rate 48000
        format FLOAT_LE
        channels 2
    }
}

# 1. Tonabgriff für den Leuchtring-Visualizer (invoked): reicht den Ton unverändert durch und legt eine
#    Mono-Kopie in /dev/shm/invoke-viz, ohne je zu warten (device/src/invoke-viz-tap.c). Sitzt vor Klang und
#    Lautstärkeregler, damit die Anzeige von beiden nicht abhängt.
# 2. Klang (device/src/invoke-eq.c): Bass, Höhen, Loudness und Nachtmodus (Kompressor). Die Werte setzt invoked live
#    über /dev/shm/invoke-eq; ohne diese Datei reicht das Plugin den Ton unverändert durch.
pcm.invoke_viz_tap {
    type ladspa
    slave.pcm "plug:invoke_music_vol"
    path "/data/invoke/lib/ladspa"
    channels 2
    plugins [ {
        label invoke_viz_tap
        policy none
        input.bindings.0 "In L"
        input.bindings.1 "In R"
        output.bindings.0 "Out L"
        output.bindings.1 "Out R"
    } {
        label invoke_eq
        policy none
        input.bindings.0 "In L"
        input.bindings.1 "In R"
        output.bindings.0 "Out L"
        output.bindings.1 "Out R"
    } ]
}

pcm.invoke_music_vol {
    type softvol
    slave.pcm "volmix_music"
    control.name "Invoke Music"
    control.card 0
}

# Durchsagen (invoked: Home Assistant, Türklingel): an Quellen-Reglern, Klang und Visualizer vorbei, eigener Regler
# "Invoke Announce" (folgt "system"). Während der Durchsage senkt invoked die Quellen ab.
pcm.invoke_announce {
    type plug
    slave {
        pcm "invoke_announce_vol"
        rate 48000
    }
}
pcm.invoke_announce_vol {
    type softvol
    slave.pcm "volmix_music"
    control.name "Invoke Announce"
    control.card 0
}
