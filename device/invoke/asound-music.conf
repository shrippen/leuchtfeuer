# Für alle Musikdienste: per ALSA_CONFIG=/data/invoke/asound-music.conf laden (siehe /etc/asound.conf).
</etc/asound-product.conf>

# Standardgerät (miniaudio/Sendspin, PortAudio/Tidal): das Quellen-PCM aus der Umgebungsvariablen INVOKE_SRC
# (z. B. INVOKE_SRC=sendspin -> invoke_sendspin), ohne sie "invoke_music".
# Der Hint ist nötig: miniaudio (Sendspin) listet nur PCMs mit Hint. Fehlt er, fehlt "default"
# in der Liste und miniaudio nimmt das erste Gerät, das Null-Gerät ("Discard all samples"):
# kein Ton und ein Kern dauerhaft ausgelastet.
pcm.!default {
    type plug
    slave.pcm {
        @func concat
        strings [ "invoke_" { @func getenv vars [ INVOKE_SRC ] default "music" } ]
    }
    hint {
        show on
        description "Default Audio Device"
    }
}

# Je Quelle ein PCM mit eigenem Softvol-Regler "Quelle <name>": invoked schaltet damit eine Quelle stumm
# (Quellen-Regel: die neueste Quelle hat Vorrang) oder senkt alle für eine Durchsage ab. Die Regler stehen
# normalerweise auf 255 (0 dB) und ändern die Lautstärke des Geräts nicht.
pcm.invoke_spotify {
    type plug
    slave.pcm "invoke_spotify_vol"
    hint { show on description "Leuchtfeuer spotify" }
}
pcm.invoke_spotify_vol {
    type softvol
    slave.pcm "invoke_music"
    control { name "Quelle spotify" card 0 }
}
