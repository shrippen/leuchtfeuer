# Für Dienste, die nur das ALSA-Standardgerät benutzen (miniaudio/Sendspin): per
# ALSA_CONFIG=/data/invoke/asound-music.conf laden (siehe /etc/asound.conf).
</etc/asound-product.conf>
# Der Hint ist nötig: miniaudio (Sendspin) listet nur PCMs mit Hint. Fehlt er, fehlt "default"
# in der Liste und miniaudio nimmt das erste Gerät, das Null-Gerät ("Discard all samples"):
# kein Ton und ein Kern dauerhaft ausgelastet.
pcm.!default {
    type plug
    slave.pcm "invoke_music"
    hint {
        show on
        description "Default Audio Device"
    }
}

# Eigener Softvol-Regler "Invoke Music" für alle Musikdienste. Das Drehrad setzt die Regler
# "system"/"voice", und der Harman-Dienst audio-ui dämpft "music" bei jedem Rastschritt auf 0
# (Musik setzt kurz aus). Der Regler hier kennt audio-ui nicht; volume-sync.sh setzt ihn
# auf den Wert von "system". Kette: Abgriff (LADSPA) -> softvol -> volmix_music (dmix) -> DSP.
# Die Umwandlung auf 48 kHz Float geschieht hier vor dem Abgriff: dmix legt die Periodendauer auf 5333,33 µs
# fest, und bei freier Rate vor dem LADSPA-Glied ergibt das z. B. bei 44,1 kHz ein leeres Intervall
# (PortAudio/Tidal bricht dann mit "snd_interval_empty" ab).
pcm.invoke_music {
    type plug
    slave {
        pcm "invoke_viz_tap"
        rate 48000
        format FLOAT_LE
        channels 2
    }
}

# Tonabgriff für den Leuchtring-Visualizer (invoked): reicht den Ton unverändert durch und legt eine
# Mono-Kopie in /dev/shm/invoke-viz, ohne je zu warten (device/src/invoke-viz-tap.c). Sitzt vor dem
# Lautstärkeregler, damit die Anzeige nicht von der Lautstärke abhängt.
pcm.invoke_viz_tap {
    type ladspa
    slave.pcm "plug:invoke_music_vol"
    path "/data/invoke/lib/ladspa"
    channels 2
    plugins [ {
        label invoke_viz_tap
        policy none
        input.bindings.0 "In L"
        input.bindings.1 "In R"
        output.bindings.0 "Out L"
        output.bindings.1 "Out R"
    } ]
}

pcm.invoke_music_vol {
    type softvol
    slave.pcm "volmix_music"
    control.name "Invoke Music"
    control.card 0
}
