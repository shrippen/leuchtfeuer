# Für Dienste, die nur das ALSA-Standardgerät benutzen (miniaudio/Sendspin): per
# ALSA_CONFIG=/data/invoke/asound-music.conf laden (siehe /etc/asound.conf).
</etc/asound-product.conf>
# Der Hint ist nötig: miniaudio (Sendspin) listet nur PCMs mit Hint. Fehlt er, fehlt "default"
# in der Liste und miniaudio nimmt das erste Gerät, das Null-Gerät ("Discard all samples"):
# kein Ton und ein Kern dauerhaft ausgelastet.
pcm.!default {
    type plug
    slave.pcm "invoke_music"
    hint {
        show on
        description "Default Audio Device"
    }
}

# Eigener Softvol-Regler "Invoke Music" für alle Musikdienste. Das Drehrad setzt die Regler
# "system"/"voice", und der Harman-Dienst audio-ui dämpft "music" bei jedem Rastschritt auf 0
# (Musik setzt kurz aus). Der Regler hier kennt audio-ui nicht; volume-sync.sh setzt ihn
# auf den Wert von "system". Gleiche Kette wie "music": softvol -> volmix_music (dmix) -> DSP.
pcm.invoke_music {
    type plug
    slave.pcm {
        type softvol
        slave.pcm "volmix_music"
        control.name "Invoke Music"
        control.card 0
    }
}
