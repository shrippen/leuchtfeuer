# Gekürzte podium.conf (Invoke-Hack), per Bind-Mount über /etc/podium/podium.conf.
# Entfernt: Cortana, Harman-Spotify (eSDK tot), OTA, Absturzbericht-Upload.
# Configuration file for Podium
#   Boot mode: 
#       normal - normal mode
#       silent - silent booting (without leds and sounds)
#       recovery - as silent
#   Run mode:
#       normal, demo, test

[General]
# Some general settings

[SystemManager]
# System Manager specific settings

[ProcessManager]
process={
        name=mcu-interface
        command=logwrapper mcu-interface 127.0.0.1 9999 &
        auto_recovery=true
        factory_test_mode=true
        demo_mode=true
        wait_ready=true
        wait_heartbeats=true
}

process={
        name=firewall-factorymode.sh
        command=firewall-factorymode.sh
        auto_recovery=false
        factory_test_mode=true
        normal_mode=false
        demo_mode=true
        wait_ready=false
        wait_hearbeats=false
}

process={
        name=dsp-client
        command=logwrapper dsp-client &
        auto_recovery=true
        factory_test_mode=true
        demo_mode=true
        wait_ready=false
        wait_heartbeats=false
}

process={
        name=audio-ui
        command=logwrapper audio-ui 127.0.0.1 9999 $boot_mode $run_mode &
        auto_recovery=true
        factory_test_mode=false
        demo_mode=true
        wait_ready=true
        wait_heartbeats=true
}

process={
        name=connection-manager
        command=logwrapper connection-manager $boot_mode &
        auto_recovery=true
        factory_test_mode=false
        demo_mode=false
        wait_ready=false
        wait_heartbeats=true
}

process={
        name=music-source-manager
        command=logwrapper music-source-manager &
        auto_recover=true
        factory_test_mode=false
        wait_ready=true
        wait_heartbeats=true
}

# (Invoke-Hack) entfernt: spotify

process={
        name=bluetooth
        command=logwrapper bluetooth.sh &
        auto_recovery=true
        factory_test_mode=false
        demo_mode=false
        wait_ready=false
        wait_heartbeats=false
}

process={
        name=bluetooth
        command=logwrapper bluetooth.sh ftm &
        auto_recovery=true
        factory_test_mode=true
        normal_mode=false
        demo_mode=false
        wait_ready=false
        wait_heartbeats=false
}

# (Invoke-Hack) entfernt: cortana-harness

process={
        name=factory-test
        command=logwrapper factory-test 127.0.0.1 9999 &
        auto_recovery=true
        factory_test_mode=true
        demo_mode=true
        normal_mode=false
        wait_ready=false
        wait_heartbeats=false
}

# (Invoke-Hack) entfernt: crash-uploader-HK.sh

process={
        name=device_auto_recovery.sh
        command=logwrapper /usr/bin/device_auto_recovery.sh &
        auto_recovery=true
        factory_test_mode=false
        demo_mode=true
        wait_ready=false
        wait_heartbeats=false
}

