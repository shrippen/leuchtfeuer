# BlueZ-Konfiguration für den Invoke (Lautsprecher, nur Klassik-Bluetooth/A2DP).
# Wird nach /data/leuchtfeuer/bluez/etc/bluetooth/main.conf kopiert.
[General]
Name = HK Invoke
# Major "Audio/Video", Minor "Lautsprecher", Dienstklasse Audio + Rendering
Class = 0x240414
DiscoverableTimeout = 0
PairableTimeout = 0
# Nur BR/EDR: Bluetooth Low Energy braucht ein Lautsprecher nicht und macht nur Ärger beim Koppeln
ControllerMode = bredr
# Wenn das Handy die Kopplung verloren hat und neu koppelt, ohne Rückfrage annehmen
JustWorksRepairing = always
FastConnectable = true

[Policy]
AutoEnable = true
