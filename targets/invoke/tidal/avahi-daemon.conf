# avahi nur für Tidal Connect (mDNS-Ankündigung), neben dem Android-mdnsd des Geräts.
# host-name nicht "invoke": der Name kollidiert (Router meldet den DHCP-Namen offenbar selbst per mDNS).
[server]
host-name=hk-invoke
use-ipv4=yes
use-ipv6=no
allow-interfaces=wlan0
disallow-other-stacks=no
enable-dbus=yes
ratelimit-interval-usec=1000000
ratelimit-burst=1000
[wide-area]
enable-wide-area=no
[publish]
publish-hinfo=no
publish-workstation=no
publish-addresses=yes
[reflector]
[rlimits]
