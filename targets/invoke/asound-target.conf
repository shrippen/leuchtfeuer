# Invoke: Hersteller-Konfiguration (definiert den dmix "volmix_music" -> DSP, 48 kHz)
</etc/asound-product.conf>

# ALSA-Plugin für die Ausgabe an Bluetooth-Lautsprecher (output.conf: type bluealsa), liegt neben den BlueZ-Programmen
pcm_type.bluealsa { lib "@LEUCHTFEUER_DIR@/bluez/lib/libasound_module_pcm_bluealsa.so" }

# Mikrofone (Sprachassistent, Gerätetest): die beiden Mikrofone am Codec wm8904 (Karte 1, Stereo). Fest in S32_LE öffnen:
# in S16_LE liefert der linke Kanal Datenmüll (nur das obere Byte, ständig Vollausschlag), der rechte stimmt. plug wandelt in
# das gewünschte Format (z. B. 16 kHz Mono für Wyoming, Mittel beider Mikrofone).
pcm.leuchtfeuer_mic {
    type plug
    slave {
        pcm "hw:1,0"
        format S32_LE
        rate 48000
        channels 2
    }
}
