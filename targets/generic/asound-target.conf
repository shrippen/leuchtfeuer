# generic: Ausgang ist ein eigener dmix auf der Karte ALSA_CARD (Vorgabe 0), damit mehrere Dienste gleichzeitig spielen.
# Andere Ausgabe (z. B. "pipewire" oder "pulse", wenn ein Sound-Server die Karte belegt): ALSA_OUTPUT in config.
pcm.leuchtfeuer_out {
    type plug
    slave.pcm {
        @func getenv
        vars [ LEUCHTFEUER_OUT ]
        default "leuchtfeuer_dmix"
    }
}
pcm.leuchtfeuer_dmix {
    type dmix
    ipc_key 4729
    ipc_perm 0660
    slave {
        pcm {
            type hw
            card {
                @func getenv
                vars [ ALSA_CARD ]
                default "0"
            }
        }
        rate 48000
        format S16_LE
        period_size 1024
        buffer_size 8192
    }
}
