<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HK Invoke</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="kante/shrippen.css">
  <link rel="stylesheet" href="kante/fonts.css">
  <link rel="stylesheet" href="app.css">
  <script src="kante/shrippen.js"></script>
</head>
<body>
  <nav class="nav brand-on">
    <div class="nav-inner">
      <a class="nav-brand" href="/login.html"><img class="brand-logo" src="favicon.svg" alt="Leuchtfeuer" width="22" height="22"><span>Leuchtfeuer</span></a>
      <div class="nav-links">
        <div class="lang" role="group" aria-label="Language">
          <button type="button" data-lang="en" aria-pressed="true">EN</button>
          <button type="button" data-lang="de" aria-pressed="false">DE</button>
        </div>
      </div>
    </div>
  </nav>
  <main class="login">
    <form class="card" id="f" autocomplete="on">
      <h3><span lang="en">Sign in</span><span lang="de">Anmelden</span></h3>
      <p><span lang="en">Enter the password of this speaker.</span><span lang="de">Gib das Passwort dieses Lautsprechers ein.</span></p>
      <input type="text" name="username" value="admin" autocomplete="username" hidden>
      <div class="field">
        <label for="pw"><span lang="en">Password</span><span lang="de">Passwort</span></label>
        <input class="input" id="pw" name="password" type="password" autocomplete="current-password" autofocus required>
      </div>
      <p id="err" class="login-err" role="alert" hidden></p>
      <div class="row"><button class="btn btn-accent" type="submit" id="go"><span lang="en">Sign in</span><span lang="de">Anmelden</span></button></div>
    </form>
  </main>
  <script src="login.js"></script>
</body>
</html>
