# Release bei einem Tag v*: alle Programme bauen (Docker, ohne Tidal), Pakete je Zielgerät zusammenstellen und
# signieren (tools/make-release.sh: invoke, generic-amd64, generic-arm64, generic-armv7), Release auf GitHub anlegen
# und Pakete, Prüfsummen und Signaturen anhängen.
# Nur GitHub: GitHub ist der öffentliche Ausspielweg und hat als einziger Release-Dateien; Gitea prüft nur (Regel
# „Gitea prüft, GitHub veröffentlicht“). install.sh --prebuilt und das Update aus der Weboberfläche laden von hier.
# Braucht das Secret LEUCHTFEUER_SIGNING_KEY (relsign keygen) im GitHub-Repository.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      # Release-Notizen: der Abschnitt der Version aus CHANGELOG.md ("## [X.Y.Z]", "## X.Y.Z" oder
      # "## vX.Y.Z", danach Leerzeichen oder Zeilenende), dahinter die Zeile zu den Paketen. Fehlt der
      # Abschnitt oder ist er leer, bricht der Lauf ab, bevor gebaut wird.
      - name: Notizen aus CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version="${TAG#v}"
          awk -v v="$version" '
            /^## / {
              if (on) exit
              h = substr($0, 4); sub(/^\[/, "", h); sub(/^v/, "", h)
              if (substr(h, 1, length(v)) == v) {
                rest = substr(h, length(v) + 1)
                if (rest == "" || rest ~ /^[] ]/) { on = 1; next }
              }
            }
            on
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || { echo "::error::CHANGELOG.md hat keine Notizen für $version (## [$version] — JJJJ-MM-TT)"; exit 1; }
          printf '\n---\n\nPakete für Updates aus der Weboberfläche: invoke (install.sh --prebuilt, ohne Tidal) und generic-<arch> (beliebiges Linux, targets/generic/setup.sh).\n' >> "$RUNNER_TEMP/notes.md"
      - name: Prüfungen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck build-essential file curl gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf
          tests/run.sh
      - name: Bauen
        run: ./build.sh --no-tidal
      - name: Paket
        env:
          LEUCHTFEUER_SIGNING_KEY: ${{ secrets.LEUCHTFEUER_SIGNING_KEY }}
        run: |
          set -eu
          tools/make-release.sh --target invoke
          for a in amd64 arm64 armv7; do
            tools/build-generic.sh $a
            tools/make-release.sh --target generic --arch $a
          done
      - name: Release auf GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Leuchtfeuer $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md"
